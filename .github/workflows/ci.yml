name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a superseded run on the same branch/PR instead of letting an old
# push's CI keep burning minutes after a newer push already replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches migration 0003_app_role_and_rls.sql, which self-provisions this
  # role/password on first migration run — nothing outside the migrations
  # needs to create it.
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: ecotrack
  DB_USER: ecotrack_app
  DB_PASSWORD: ecotrack_app
  DB_MIGRATOR_USER: ecotrack
  DB_MIGRATOR_PASSWORD: ecotrack
  # S3 stand-in for the integration job (s3mock below). Required by the app's config
  # schema, so without these every suite that boots AppModule fails at startup.
  # OIDC_* is not set here: the e2e harness points it at its own in-process JWKS.
  S3_BUCKET: ecotrack-media
  S3_ENDPOINT: http://localhost:9090
  S3_FORCE_PATH_STYLE: 'true'
  S3_PUBLIC_URL: http://localhost:9090/ecotrack-media
  S3_ACCESS_KEY_ID: test
  S3_SECRET_ACCESS_KEY: test

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking gates per SRS §3.5.3 — both must exit 0, not just report.
      - name: ESLint
        run: pnpm exec eslint "{src,test}/**/*.ts"
      - name: TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.json

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image docker-compose.yml uses for local dev — RLS/spatial
        # behavior must be tested against the real engine, not a substitute.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecotrack
          POSTGRES_PASSWORD: ecotrack
          POSTGRES_DB: ecotrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # MinIO (used by docker-compose.yml locally) no longer publishes images to
      # Docker Hub. s3mock covers what the media suite needs; it does not verify
      # request signatures, which is why that suite asserts on the signed headers
      # instead of expecting a mismatched upload to be refused.
      s3:
        image: adobe/s3mock:latest
        env:
          initialBuckets: ecotrack-media
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run migrations
        run: pnpm db:migrate
      - name: Integration tests
        run: pnpm test:integration

  # Runs on the self-hosted runner installed on the production EC2 instance (see
  # docs/04-runbooks/ci-cd.md), not a GitHub-hosted one — this job's shell commands
  # execute directly on that box. No SSH involved: the runner polls GitHub over an
  # outbound connection, so EC2's inbound security group is unchanged.
  deploy:
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    concurrency:
      group: ecotrack-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t ecotrack-api:${{ github.sha }} .

      # Idempotent: an already-applied migration never runs twice. This also
      # re-asserts the ecotrack_app role's password from DB_PASSWORD every deploy
      # (see migrate.ts), so a rotated password takes effect on the next push.
      - name: Run database migrations
        run: |
          docker run --rm --network ecotrack \
            --env-file /etc/ecotrack/api.env --env-file /etc/ecotrack/migrator.env \
            -v /etc/ecotrack/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro \
            ecotrack-api:${{ github.sha }} node dist/database/migrate.js

      # Stop-and-start, not blue-green: a few seconds of downtime per deploy,
      # traded for far fewer moving parts on a single small instance.
      - name: Restart the API container
        run: |
          docker rm -f ecotrack-api || true
          docker run -d --name ecotrack-api --restart unless-stopped --network ecotrack \
            -p 127.0.0.1:4000:4000 --env-file /etc/ecotrack/api.env \
            -v /etc/ecotrack/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro \
            ecotrack-api:${{ github.sha }}

      - name: Health check
        run: curl --fail --retry 8 --retry-delay 3 --retry-all-errors http://127.0.0.1:4000/v1/health

      # Old images pile up on the instance's disk otherwise. 72h keeps the
      # previous build or two around for a manual rollback.
      - name: Prune old images
        if: always()
        run: docker image prune -f --filter "until=72h"
