services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecotrack
      POSTGRES_PASSWORD: ecotrack
      POSTGRES_DB: ecotrack
    ports:
      - '5433:5432'
    volumes:
      - ecotrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecotrack']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecotrack_postgres_data:
